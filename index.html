<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CZE SVK Riders | Pro Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { brand: { 500: '#ff4500', 600: '#e03e00' }, dark: { 800: '#1e293b', 900: '#0f172a' } }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-900 text-slate-300 font-sans antialiased flex h-screen overflow-hidden">
    
    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <header class="h-16 bg-dark-800/50 backdrop-blur-md border-b border-slate-700 flex items-center justify-between px-6 z-10 shrink-0">
            <h2 class="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-brand-500 to-yellow-500">CZE SVK Riders Analytics</h2>
            <span class="flex items-center gap-2 text-xs font-medium px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Firebase Live
            </span>
        </header>

        <div class="p-6 space-y-6">
            <!-- Statistiky (Karty) -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-dark-800 p-5 rounded-2xl border border-slate-700 shadow-lg">
                    <p class="text-sm font-medium text-slate-400">Průměrné Skóre Týmu</p>
                    <h3 id="avg-score" class="text-3xl font-bold text-white mt-1">---</h3>
                </div>
                <div class="bg-dark-800 p-5 rounded-2xl border border-slate-700 shadow-lg">
                    <p class="text-sm font-medium text-slate-400">Odehrané Eventy</p>
                    <h3 id="total-events" class="text-3xl font-bold text-white mt-1">---</h3>
                </div>
                <div class="bg-dark-800 p-5 rounded-2xl border border-slate-700 shadow-lg">
                    <p class="text-sm font-medium text-slate-400">Win Rate</p>
                    <h3 id="win-rate" class="text-3xl font-bold text-brand-500 mt-1">---</h3>
                </div>
            </div>

            <!-- Tabulka historie eventů -->
            <div class="bg-dark-800 rounded-2xl border border-slate-700 shadow-lg overflow-hidden">
                <div class="p-6 border-b border-slate-700">
                    <h3 class="text-lg font-bold text-white">Historie Zápasů a Soupiska</h3>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-slate-400">
                        <thead class="text-xs text-slate-300 uppercase bg-dark-900/50 border-b border-slate-700">
                            <tr>
                                <th class="px-6 py-4">Datum</th>
                                <th class="px-6 py-4">Soupeř</th>
                                <th class="px-6 py-4 text-center">Náš Tým</th>
                                <th class="px-6 py-4 text-center">Výsledek</th>
                                <th class="px-6 py-4 text-center">Hráči</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-700/50">
                            <!-- JS sem vloží data -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Skrytý Modal pro zobrazení 50 hráčů -->
    <div id="playersModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
        <div class="bg-dark-800 rounded-2xl border border-slate-700 shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 id="modalTitle" class="text-lg font-bold text-white">Soupiska</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex-1">
                <table class="w-full text-sm text-left text-slate-300">
                    <thead class="text-xs uppercase bg-dark-900/50 border-b border-slate-700">
                        <tr><th class="py-2 px-4">#</th><th class="py-2 px-4">Jméno</th><th class="py-2 px-4 text-right">Skóre</th></tr>
                    </thead>
                    <tbody id="modalBody" class="divide-y divide-slate-700/50"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let globalEventsData = [];

        fetch('https://riders-league-bot-default-rtdb.europe-west1.firebasedatabase.app/data.json')
            .then(res => res.json())
            .then(data => {
                if (data && data.team_events) {
                    globalEventsData = data.team_events.sort((a, b) => b.id - a.id); // Od nejnovějšího
                    renderDashboard(globalEventsData);
                }
            })
            .catch(err => console.error("Chyba DB:", err));

        function renderDashboard(events) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            let totalScore = 0, wins = 0;

            events.forEach((event, index) => {
                totalScore += event.score || 0;
                if(event.win) wins++;

                const winBadge = event.win 
                    ? `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-1 rounded text-xs font-bold">VÝHRA</span>`
                    : `<span class="bg-red-500/10 text-red-400 border border-red-500/20 px-2 py-1 rounded text-xs font-bold">PROHRA</span>`;

                const btn = (event.nas_tym_detaily && event.nas_tym_detaily.length > 0)
                    ? `<button onclick="openModal(${index})" class="bg-brand-500 hover:bg-brand-600 text-white px-3 py-1.5 rounded-lg text-xs transition">Ukázat ${event.nas_tym_detaily.length} hráčů</button>`
                    : `<span class="text-xs text-slate-500">Žádná data</span>`;

                tbody.innerHTML += `
                    <tr class="hover:bg-dark-900/50">
                        <td class="px-6 py-4 text-white font-medium">${event.date || '-'}</td>
                        <td class="px-6 py-4">${event.opponent || '-'}</td>
                        <td class="px-6 py-4 text-center font-bold">${(event.score || 0).toLocaleString()}</td>
                        <td class="px-6 py-4 text-center">${winBadge}</td>
                        <td class="px-6 py-4 text-center">${btn}</td>
                    </tr>
                `;
            });

            document.getElementById('total-events').innerText = events.length;
            if(events.length > 0) {
                document.getElementById('avg-score').innerText = Math.round(totalScore / events.length).toLocaleString();
                document.getElementById('win-rate').innerText = Math.round((wins / events.length) * 100) + ' %';
            }
        }

        function openModal(index) {
            const event = globalEventsData[index];
            document.getElementById('modalTitle').innerText = `Soupiska vs ${event.opponent}`;
            const mBody = document.getElementById('modalBody');
            mBody.innerHTML = "";
            
            // Seřazení hráčů od nejlepšího
            const hraci = event.nas_tym_detaily.sort((a, b) => b.skore - a.skore);
            
            hraci.forEach((hrac, i) => {
                mBody.innerHTML += `
                    <tr>
                        <td class="py-2 px-4 text-slate-500">${i + 1}.</td>
                        <td class="py-2 px-4 font-medium text-white">${hrac.jmeno}</td>
                        <td class="py-2 px-4 text-right text-brand-400 font-bold">${hrac.skore.toLocaleString()}</td>
                    </tr>
                `;
            });
            
            document.getElementById('playersModal').classList.remove('hidden');
            document.getElementById('playersModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('playersModal').classList.add('hidden');
            document.getElementById('playersModal').classList.remove('flex');
        }
    </script>
</body>
</html>
